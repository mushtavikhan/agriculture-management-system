<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agriculture Management System - CRUD Operations</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .nav-tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
            flex-wrap: wrap;
        }

        .nav-tab {
            flex: 1;
            padding: 15px 20px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1em;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .nav-tab:hover {
            background: #e0e0e0;
        }

        .nav-tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
            margin-bottom: -2px;
        }

        .content {
            padding: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .form-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-danger {
            background: #f44336;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background: #d32f2f;
        }

        .btn-edit {
            background: #2196F3;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-edit:hover {
            background: #1976D2;
        }

        .table-section {
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #f5f5f5;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .nav-tabs {
                overflow-x: auto;
            }

            .nav-tab {
                min-width: 120px;
            }

            table {
                font-size: 0.9em;
            }

            th, td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌾 Agriculture Management System</h1>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('farmers')">👨‍🌾 Farmers</button>
            <button class="nav-tab" onclick="switchTab('crops')">🌽 Crops</button>
            <button class="nav-tab" onclick="switchTab('land')">🏞️ Land</button>
        </div>

        <div class="content">
            <!-- Farmers Tab -->
            <div id="farmers" class="tab-content active">
                <div id="farmers-alert"></div>

                <div class="form-section">
                    <div class="form-title">Add/Edit Farmer</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="farmer-first-name">First Name *</label>
                            <input type="text" id="farmer-first-name" placeholder="Enter first name">
                        </div>
                        <div class="form-group">
                            <label for="farmer-last-name">Last Name *</label>
                            <input type="text" id="farmer-last-name" placeholder="Enter last name">
                        </div>
                        <div class="form-group">
                            <label for="farmer-email">Email</label>
                            <input type="email" id="farmer-email" placeholder="Enter email">
                        </div>
                        <div class="form-group">
                            <label for="farmer-phone">Phone</label>
                            <input type="tel" id="farmer-phone" placeholder="Enter phone number">
                        </div>
                        <div class="form-group">
                            <label for="farmer-address">Address</label>
                            <input type="text" id="farmer-address" placeholder="Enter address">
                        </div>
                        <div class="form-group">
                            <label for="farmer-city">City</label>
                            <input type="text" id="farmer-city" placeholder="Enter city">
                        </div>
                        <div class="form-group">
                            <label for="farmer-state">State/Province</label>
                            <input type="text" id="farmer-state" placeholder="Enter state">
                        </div>
                        <div class="form-group">
                            <label for="farmer-postal">Postal Code</label>
                            <input type="text" id="farmer-postal" placeholder="Enter postal code">
                        </div>
                        <div class="form-group">
                            <label for="farmer-country">Country</label>
                            <input type="text" id="farmer-country" placeholder="Enter country">
                        </div>
                        <div class="form-group">
                            <label for="farmer-experience">Experience (years)</label>
                            <input type="number" id="farmer-experience" placeholder="0" min="0">
                        </div>
                    </div>
                    <div class="button-group">
                        <button class="btn-primary" onclick="addOrUpdateFarmer()">Save Farmer</button>
                        <button class="btn-secondary" onclick="resetFarmerForm()">Clear Form</button>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="farmer-count">0</div>
                        <div class="stat-label">Total Farmers</div>
                    </div>
                </div>

                <div class="table-section">
                    <div class="form-title">Farmers List</div>
                    <div id="farmers-table-container"></div>
                </div>
            </div>

            <!-- Crops Tab -->
            <div id="crops" class="tab-content">
                <div id="crops-alert"></div>

                <div class="form-section">
                    <div class="form-title">Add/Edit Crop</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="crop-name">Crop Name *</label>
                            <input type="text" id="crop-name" placeholder="Enter crop name">
                        </div>
                        <div class="form-group">
                            <label for="crop-type">Crop Type</label>
                            <input type="text" id="crop-type" placeholder="e.g., Cereal, Vegetable">
                        </div>
                        <div class="form-group">
                            <label for="crop-planting-season">Planting Season</label>
                            <input type="text" id="crop-planting-season" placeholder="e.g., June-July">
                        </div>
                        <div class="form-group">
                            <label for="crop-harvest-season">Harvest Season</label>
                            <input type="text" id="crop-harvest-season" placeholder="e.g., Nov-Dec">
                        </div>
                        <div class="form-group">
                            <label for="crop-yield">Average Yield</label>
                            <input type="number" id="crop-yield" placeholder="Enter yield amount" step="0.01">
                        </div>
                        <div class="form-group">
                            <label for="crop-yield-unit">Yield Unit</label>
                            <input type="text" id="crop-yield-unit" placeholder="e.g., kg/hectare">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="crop-description">Description</label>
                        <textarea id="crop-description" placeholder="Enter crop description" rows="3"></textarea>
                    </div>
                    <div class="button-group">
                        <button class="btn-primary" onclick="addOrUpdateCrop()">Save Crop</button>
                        <button class="btn-secondary" onclick="resetCropForm()">Clear Form</button>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="crop-count">0</div>
                        <div class="stat-label">Total Crops</div>
                    </div>
                </div>

                <div class="table-section">
                    <div class="form-title">Crops List</div>
                    <div id="crops-table-container"></div>
                </div>
            </div>

            <!-- Land Tab -->
            <div id="land" class="tab-content">
                <div id="land-alert"></div>

                <div class="form-section">
                    <div class="form-title">Add/Edit Land</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="land-farmer-id">Farmer *</label>
                            <select id="land-farmer-id">
                                <option value="">Select a farmer</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="land-name">Land Name</label>
                            <input type="text" id="land-name" placeholder="Enter land name">
                        </div>
                        <div class="form-group">
                            <label for="land-area">Area *</label>
                            <input type="number" id="land-area" placeholder="Enter area" step="0.01">
                        </div>
                        <div class="form-group">
                            <label for="land-area-unit">Area Unit</label>
                            <select id="land-area-unit">
                                <option value="hectare">Hectare</option>
                                <option value="acre">Acre</option>
                                <option value="sqm">Square Meter</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="land-soil-type">Soil Type</label>
                            <input type="text" id="land-soil-type" placeholder="e.g., Loamy">
                        </div>
                        <div class="form-group">
                            <label for="land-location">Location</label>
                            <input type="text" id="land-location" placeholder="Enter location">
                        </div>
                    </div>
                    <div class="button-group">
                        <button class="btn-primary" onclick="addOrUpdateLand()">Save Land</button>
                        <button class="btn-secondary" onclick="resetLandForm()">Clear Form</button>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="land-count">0</div>
                        <div class="stat-label">Total Land</div>
                    </div>
                </div>

                <div class="table-section">
                    <div class="form-title">Land List</div>
                    <div id="land-table-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/farmers.js"></script>
    <script src="js/crops.js"></script>
    <script src="js/land.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
